name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@v0.11.38

      - name: Install Dependencies
        run: bun install

      - name: Publish
        run: pantry publish --npm --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@v1.2.11
        with:
          files: |
            packages/ts-qr-codes/bin/qrx-linux-x64
            packages/ts-qr-codes/bin/qrx-linux-arm64
            packages/ts-qr-codes/bin/qrx-windows-x64.exe
            packages/ts-qr-codes/bin/qrx-darwin-x64
            packages/ts-qr-codes/bin/qrx-darwin-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
